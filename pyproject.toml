[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-myplugin"
version = "0.1.0"
description = "A pytest plugin scaffold for secondary development."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "sarah-mengqigu", email = "gumengqi2025@gmail.com" },
]
keywords = ["pytest", "plugin", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "PyGithub>=2.10.0",
  "pytest>=7.4",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "allure-pytest>=2.16.0",
  "build>=1.2",
  "pytest>=7.4",
  "playwright>=1.62.0",
  "pytest-cov>=4.1",
  "pytest-playwright>=0.9.0",
  "ruff>=0.6",
]

[project.entry-points.pytest11]
myplugin = "pytest_myplugin.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pytest_myplugin = ["py.typed", "config/*.toml"]

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "api: JSON-defined API test cases",
  "integration: tests that call external services",
  "myplugin: tests that exercise the pytest-myplugin example extension",
  "ui: browser-based UI tests",
]

[tool.coverage.run]
branch = true
source = ["pytest_myplugin"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
